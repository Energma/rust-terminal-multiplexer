name: Release

# Every green CI run on main prepares and builds the next version on its own.
# Publishing waits for approval on the `release` environment (Review
# deployments → Approve); nothing is pushed or published before that.
# - Version: from conventional commits since the last tag (see
#   scripts/release-version.sh), or picked in the Run workflow form.
# - A newer run replaces an older one still waiting for approval.
# - Pushing a v* tag by hand still builds it; publishing waits for approval too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest tag (auto = from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Exact version instead, e.g. 1.4.0 (leave empty to use the bump)"
        type: string
        required: false
      commit:
        description: "Commit SHA or branch to release (empty = main)"
        type: string
        required: false
      notes:
        description: "Text shown above the generated release notes"
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit || 'main' }}
          fetch-depth: 0
      # The automatic path only starts after green CI; the form can pick any
      # commit, so check it there.
      - name: Check CI passed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$ok" = 0 ]; then
            echo "::error::CI has not passed on $sha; wait for it or pick a commit with green CI"
            exit 1
          fi
      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          EXACT: ${{ inputs.version }}
        run: |
          set +e
          v=$(bash scripts/release-version.sh "$BUMP" "$EXACT"); rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "Nothing to release: no commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          {
            echo "## Release v$v (waiting for approval to publish)"
            echo
            echo "Commit \`$(git rev-parse --short HEAD)\`, changes since ${last:-the start}:"
            echo
            git log --no-merges --format='- %s' "${last:+$last..}HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    # After `prepare` found something to release, or straight away on a tag push.
    if: >-
      !cancelled() &&
      ((needs.prepare.result == 'success' && needs.prepare.outputs.tag != '') ||
       (needs.prepare.result == 'skipped' && github.event_name == 'push'))
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
      BUMPED: ${{ needs.prepare.outputs.tag != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          # Static build: runs on any Linux regardless of glibc version.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The version commit is only pushed on publish, so build from the same
      # bump applied here; `publish` repeats it to make that commit.
      - name: Bump the version
        if: env.BUMPED == 'true'
        shell: bash
        run: bash scripts/release-bump.sh "${TAG#v}"
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name=rmx-${TAG}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rmx README.md docs/CONFIG.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "rmx-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/rmx.exe, README.md, docs/CONFIG.md $name
          Compress-Archive $name "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rmx-*

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the job wait for approval.
    environment: release
    # A newer run waiting here replaces an older one that is still waiting.
    concurrency:
      group: release-publish
      cancel-in-progress: true
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.outputs.tag != ''
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: needs.prepare.outputs.tag != ''
      - name: Commit, tag and push the version
        if: needs.prepare.outputs.tag != ''
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          bash scripts/release-bump.sh "${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git commit -am "chore: release $TAG"
          git tag -a "$TAG" -m "$TAG${NOTES:+: $NOTES}"
          # Main moves forward with the bump only if nothing merged since; an
          # older commit gets a tag only, so main is never rewound or forked.
          refs=("refs/tags/$TAG")
          [ "$base" = "$(git rev-parse origin/main)" ] && refs=("HEAD:refs/heads/main" "${refs[@]}")
          git push --atomic origin "${refs[@]}"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body: ${{ inputs.notes }}
          files: rmx-*
          generate_release_notes: true
